                    # # to be used for passive link 30 cm
                    # 12: 0x00000744,

                    # # bimanual hub
                    # 12: 0x00000844,

                    # # straight CONCERT A
                    # 2: 0x00000441,

                    # # non-structural cube
                    # 1: 0x00000202,

                    # # to be used for passive link 30 cm
                    # 3: 0x00000324,

                    # # to be used for passive link 30 cm
                    # 4: 0x00000424,

                    # # to be used for passive link 30 cm
                    # 5: 0x00000524,
