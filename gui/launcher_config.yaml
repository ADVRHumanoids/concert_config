context:
  session: concert
  params:
    hw_type: ec_pos
  .defines:
    - &embedded embedded@10.24.10.100
    - &control concert@10.24.10.102
    - &vision concert@10.24.10.101

    - &docker-xeno  concert-noble-ros2-xeno-exp-1
    - &docker-base  concert-noble-ros2-dev-1
    - &docker-nvidia concert-noble-ros2-dev-nvidia-1

ecat:
  cmd: ecat_master
  machine: *embedded
  docker: *docker-xeno

xbot2:
  cmd: xbot2-core --hw {hw_type}
  machine: *embedded
  ready_check: timeout 5 ros2 topic echo /xbotcore/joint_states --once
  docker: *docker-xeno
  variants:
    verbose:
      cmd: "{cmd} -V"
    hw_type:
      - impedance:
          params:
            hw_type: ec_imp
      - idle:
          params:
            hw_type: ec_idle
      - position:
          params:
            hw_type: ec_pos
      - base_only:
          params:
            hw_type: ec_hybrid
      - dummy:
          params:
            hw_type: dummy

front_lidar:
  machine: *vision
  docker: *docker-nvidia
  # one pipeline: Ctrl-C reaches both nodes; driver stdout to stderr, so the pipe stays empty
  cmd: >-
    ros2 run velodyne_driver velodyne_driver_node
    --ros-args -r __ns:=/VLP16_lidar_front
    --params-file /home/user/xbot2_ws/src/concert_config/ouster/velodyne_vlp16_front.yaml
    1>&2 |
    ros2 run velodyne_pointcloud velodyne_transform_node
    --ros-args -r __ns:=/VLP16_lidar_front
    --params-file /home/user/xbot2_ws/src/concert_config/ouster/velodyne_vlp16_front.yaml
  ready_check: timeout 3 ros2 topic echo --once /VLP16_lidar_front/velodyne_points
  show_ui: false

back_lidar:
  machine: *control
  docker: *docker-base
  # one pipeline: Ctrl-C reaches both nodes; driver stdout to stderr, so the pipe stays empty
  cmd: >-
    ros2 run velodyne_driver velodyne_driver_node
    --ros-args -r __ns:=/VLP16_lidar_back
    --params-file /home/user/xbot2_ws/src/concert_config/ouster/velodyne_vlp16_back.yaml
    1>&2 |
    ros2 run velodyne_pointcloud velodyne_transform_node
    --ros-args -r __ns:=/VLP16_lidar_back
    --params-file /home/user/xbot2_ws/src/concert_config/ouster/velodyne_vlp16_back.yaml
  ready_check: timeout 3 ros2 topic echo --once /VLP16_lidar_back/velodyne_points
  show_ui: false

# RealSense D435s on the control pc, configured by data/control/D435_camera_*.yaml
front_camera:
  machine: *control
  docker: *docker-base
  cmd: >-
    ros2 launch realsense2_camera rs_launch.py
    camera_namespace:=/ camera_name:=D435_camera_front
    config_file:=/home/user/xbot2_ws/src/concert_config/data/control/D435_camera_front.yaml
  ready_check: timeout 3 ros2 topic echo --once /D435_camera_front/color/image_raw --no-arr
  show_ui: false

back_camera:
  machine: *control
  docker: *docker-base
  cmd: >-
    ros2 launch realsense2_camera rs_launch.py
    camera_namespace:=/ camera_name:=D435_camera_back
    config_file:=/home/user/xbot2_ws/src/concert_config/data/control/D435_camera_back.yaml
  ready_check: timeout 3 ros2 topic echo --once /D435_camera_back/color/image_raw --no-arr
  show_ui: false

drill_camera:
  machine: *vision
  docker: *docker-nvidia
  cmd: >-
    ros2 launch realsense2_camera rs_launch.py
    camera_namespace:=/ camera_name:=drill_camera_E
    config_file:=/home/user/xbot2_ws/src/concert_config/data/perception/drill_camera_E.yaml
  ready_check: timeout 3 ros2 topic echo --once /drill_camera_E/color/image_raw --no-arr
  show_ui: false
