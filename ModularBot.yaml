XBotInterface:
    urdf_path: $(rospack find modularbot)/urdf/ModularBot.urdf
    srdf_path: $(rospack find modularbot)/srdf/ModularBot.srdf
    joint_map_path: $(rospack find modularbot)/joint_map/ModularBot_joint_map.yaml

ModelInterface:
    model_type: RBDL
    is_model_floating_base: true


xbotcore_device_configs:
    sim: $(rospack find modularbot)/config/hal/ModularBot_gz.yaml
    dummy: $(rospack find modularbot)/config/hal/ModularBot_dummy.yaml
    ec_imp: $(rospack find modularbot)/config/hal/ModularBot_ec_all.yaml
    ec_idle: $(rospack find modularbot)/config/hal/ModularBot_ec_all.yaml
    ec_pos: $(rospack find modularbot)/config/hal/ModularBot_ec_all.yaml


xbotcore_threads:

    rt_main:
        sched: fifo
        prio: 60
        period: 0.001

    nrt_main:
        sched: other
        prio: 0
        period: 0.005


xbotcore_plugins:
    
    ros_io:
        thread: nrt_main
        type: ros_io
    
    ros_ctrl:
        thread: nrt_main
        type: ros_control
    
    homing:
        thread: rt_main
        type: homing
    
    ec_ros:
        thread: nrt_main
        type: ec_ros

    cartesio_imp: 
        thread: rt_main 
        type: albero_cartesio_rt
        params:
            enabled_chains: 
                value: [chain_E]
                type: vector<string>
            problem_description:
                value: $PWD/ModularBot_impedance_config.yaml
                type: file
            solver: {value: AlberoImpedance, type: string}
            enable_feedback: {value: true, type: bool}
            fc_map: {value: {low: 0.95, high: 0.95}, type: map<double>}

    # thalesarm_gcomp:
    #     type: thalesarm_gcomp
    #     thread: rt_main
    #     params:
    #         enabled_chains: 
    #             value: [chain_E]
    #             type: vector<string>

    gcomp_example:
        type: gcomp_example
        thread: rt_main
        params:
            enabled_chains: 
                value: [chain_E]
                type: vector<string>

xbotcore_param:
    /xbot/hal/joint_safety/filter_autostart: {value: true, type: bool}
    /xbot/hal/joint_safety/filter_cutoff_hz: {value: 2.0, type: double}
    /xbot/trigger_safety_on_shutdown:
        value: false
        type: bool
