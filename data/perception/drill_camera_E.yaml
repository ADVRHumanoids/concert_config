# realsense2_camera rs_launch.py config_file of drill_camera_E (serial from concert_resources drill_camera.json).
# Streams as the URDF's: 424x240 at 6 Hz. Frames come from the URDF, so the driver MUST NOT publish TF.
serial_no: "236522070709"
rgb_camera.color_profile: 424x240x6
depth_module.depth_profile: 424x240x6
publish_tf: false
# concert_vision's blob detector reads aligned_depth_to_color
align_depth.enable: true
