# ROS 2 params for velodyne_driver_node and velodyne_transform_node, in any namespace.
/**/velodyne_driver_node:
  ros__parameters:
    device_ip: 10.24.10.201  # TBD
    gps_time: false
    time_offset: 0.0
    enabled: true
    read_once: false
    read_fast: false
    repeat_delay: 0.0
    frame_id: VLP16_lidar_front_base_link
    model: VLP16
    rpm: 600.0
    port: 2369
    timestamp_first_packet: false

/**/velodyne_transform_node:
  ros__parameters:
    calibration: /opt/ros/jazzy/share/velodyne_pointcloud/params/VLP16db.yaml
    model: VLP16
    min_range: 0.9
    max_range: 130.0
    view_direction: 0.0
    fixed_frame: VLP16_lidar_front_base_link
    target_frame: VLP16_lidar_front_base_link
    organize_cloud: true
