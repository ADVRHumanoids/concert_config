XBotInterface:
    urdf_path: $(ros2 pkg prefix --share modularbot)/urdf/ModularBot.urdf
    srdf_path: $(ros2 pkg prefix --share modularbot)/srdf/ModularBot.srdf
    joint_map_path: $(ros2 pkg prefix --share modularbot)/joint_map/ModularBot_joint_map.yaml

ModelInterface:
  model_type: pin
  is_model_floating_base: true

# hal
xbotcore_device_configs:
    sim: $(ros2 pkg prefix --share modularbot)/config/hal/ModularBot_gz.yaml
    dummy: $(ros2 pkg prefix --share modularbot)/config/hal/ModularBot_dummy.yaml
    ec_imp: $(ros2 pkg prefix --share modularbot)/config/hal/ModularBot_ec_all.yaml
    ec_idle: $(ros2 pkg prefix --share modularbot)/config/hal/ModularBot_ec_all.yaml
    ec_pos: $(ros2 pkg prefix --share modularbot)/config/hal/ModularBot_ec_all.yaml
    ec_hybrid: $(ros2 pkg prefix --share modularbot)/config/hal/ModularBot_ec_all.yaml

# threads
xbotcore_threads:
    rt_main:  {sched: fifo , prio: 60, period: 0.001}
    nrt_main: {sched: other, prio: 0 , period: 0.001}
    main: {sched: other, prio: 0 , period: 0.001, main: true}

.ctrl_override: &ctrl_override
  type: map<int>
  value:
    dagana_E_claw_joint: 0

# plugins
xbotcore_plugins:
  homing:
    thread: rt_main
    type: homing
    params:
      ctrl_override: *ctrl_override
      time: {value: 10.0, type: double}
  ros_io:
    thread: main
    type: ros2_io
  ros_control: {thread: nrt_main, type: ros2_control}
  omnisteering:
    type: omnisteering_controller_plugin
    thread: nrt_main
    params:
      wheel_names: {value: [wheel_A, wheel_B, wheel_C, wheel_D], type: vector<string>}
      wheel_radius: {value: [0.16, 0.16, 0.16, 0.16], type: vector<double>}
  cartesio_imp:
    thread: rt_main
    type: albero_cartesio_rt
    params:
      ctrl_override: *ctrl_override
      enabled_chains: {value: [chain_E], type: vector<string>}
      problem_description:
        value: $PWD/impedance_config.yaml
        type: file
      solver: {value: AlberoImpedance, type: string}
      enable_feedback: {value: true, type: bool}
      fc_map: {value: {low: 0.85, high: 0.99}, type: map<double>}
      use_payload_estimator:
        value: false  # note: keep false if you care to live
        type: bool
      payload_estimator_link: {value: ee_E, type: string}
  gcomp:
    thread: rt_main
    type: gcomp_example
    params:
      enabled_chains: {value: [chain_E], type: vector<string>}
  # base twist from the wrench at ee_E (force_follow_me force_estimation.launch.py)
  force_follow_me:
    type: force_follow_me
    thread: nrt_main
    params:
      wrench_topic: {value: /force_estimation/ee_E, type: string}
      # maps of wrench/twist indices (0-5, written as strings)
      wrench_to_twist_map: {value: {'0': 0, '1': 5}, type: map<int>}  # Fx -> vx, Fy -> wz
      wrench_threshold: {value: {'0': 8.0, '1': 8.0}, type: map<double>}
      wrench_limits: {value: {'0': 85.0, '1': 85.0}, type: map<double>}
      twist_limits: {value: {'0': 0.3, '1': 0.3, '5': 0.6}, type: map<double>}
      use_safety: {value: true, type: bool}
      sensor_type: {value: 0, type: int}  # 0 for sonar 1 for lidar [wip]
      sensors:
        value: ["ultrasound_rr_lat", "ultrasound_rl_sag", "ultrasound_rl_lat", "ultrasound_fl_lat", "ultrasound_fr_lat"]  # "ultrasound_rr_sag",
        type: vector<string>
      sensor_threshold:
        value: [0.75, 0.3]  # max min threshold
        type: vector<double>
    remap:
      cmd_vel_V6: omnisteering/cmd_vel_V6

# global parameters
xbotcore_param:
  /xbot/hal/joint_safety/filter_autostart: {value: true, type: bool}
  /xbot/hal/joint_safety/filter_cutoff_hz: {value: 2.0, type: double}
  /xbot/trigger_safety_on_shutdown: {value: true, type: bool}
  /xbot/hal/joint_safety/hack/disable_filter_tuning/dagana_E_claw_joint: {value: true, type: bool}
